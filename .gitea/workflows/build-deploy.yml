# push to main → runner vets + builds a static Go binary → scp to the webhook VM →
# privileged install script swaps it in, health-checks, and rolls back on failure.
#
# The VM needs NO git credentials and NO Go toolchain — CI produces the binary.
#
# Required secrets (Settings → Actions → Secrets):
#   DEPLOY_HOST     192.168.15.30   (the webhook VM)
#   DEPLOY_USER     deploy user on that VM
#   DEPLOY_SSH_KEY  private key whose public half is in that user's authorized_keys
#
# One-time VM setup: see deploy/webhook-receiver-deploy.sh (install to
# /usr/local/sbin/ + a single NOPASSWD sudoers entry).

name: build-deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build via `docker build` (streams the context) rather than a bind mount — the
      # runner runs jobs in a container against the host daemon, so -v "$PWD" would
      # resolve on the host and mount an empty dir. Then extract the binary.
      - name: Vet + build static binary
        run: |
          set -e
          docker build -f Dockerfile.build -t webhook-receiver-build .
          cid=$(docker create webhook-receiver-build sh)
          docker cp "$cid:/out/webhook-receiver" ./webhook-receiver
          docker rm "$cid" >/dev/null
          ls -lh webhook-receiver

      - name: Deploy to webhook VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/webhook_deploy
          chmod 600 ~/.ssh/webhook_deploy
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS="-i $HOME/.ssh/webhook_deploy -o StrictHostKeyChecking=yes"

          scp $SSH_OPTS webhook-receiver "$SSH_USER@$SSH_HOST:/tmp/webhook-receiver-new"
          # Single whitelisted sudo command; all root logic lives on the VM.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'sudo /usr/local/sbin/webhook-receiver-deploy'

          rm -f ~/.ssh/webhook_deploy

      - name: Clean up runner artifacts
        if: always()
        run: |
          rm -f webhook-receiver || true
          docker rmi webhook-receiver-build || true
          docker image prune -f || true
